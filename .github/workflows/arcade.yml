name: arcade

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Live Hack The Box badge and card from HTB's public profile API (no token needed)
      - name: HTB badge
        run: |
          mkdir -p dist
          python3 scripts/htb_card.py 1969044 dist https://raw.githubusercontent.com/${{ github.repository }}/output

      # All six arcade games, so swapping one in the README is a one-word change
      - uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper"
          player_style: aggressive

      # Publish everything in dist/ to the output branch
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Re-enable this schedule on every run, so GitHub never auto-disables it
      # after 60 days without repository activity
      - name: Keep schedule alive
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/arcade.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
